# =====================================================
# APPLICATION
# =====================================================
spring.application.name=ProductServices



# =====================================================
# MYSQL DATABASE CONFIGURATION (PRIMARY DB)
# =====================================================

# JPA should NOT modify schema because Flyway manages migrations
spring.jpa.hibernate.ddl-auto=none

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/productservice
spring.datasource.username=productserviceuser
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show SQL queries in console (useful for debugging)
spring.jpa.show-sql=true

#  IMPORTANT: Hibernate dialect for MySQL
# Required so Hibernate generates correct MySQL syntax
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



# =====================================================
# FLYWAY MIGRATION
# =====================================================

# Enable Flyway for schema version control
spring.flyway.enabled=true



# =====================================================
# REDIS CACHE CONFIGURATION
# =====================================================

# Redis server connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Enable Redis caching
spring.cache.type=redis

# Cache TTL = 10 minutes (600000 ms)
spring.cache.redis.time-to-live=600000



